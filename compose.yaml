services:
  app:
    build: .
    depends_on:
      - db
      - rabbitmq
    container_name: go_social
    env_file:
      - .env
    environment:
      POSTGRES_PORT: 5432
      POSTGRES_HOST: db
      RABBITMQ_HOST: rabbitmq
    ports:
      - "3000:3000"    
    restart: always

  db:
    image: postgres:18
    restart: always
    container_name: go_social_db
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PORT: ${POSTGRES_PORT}
    volumes:
        - db_data:/var/lib/postgresql
  rabbitmq:
    image: rabbitmq:management-alpine
    ports:
    - "5672:5672"
    - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: "guest"
      RABBITMQ_DEFAULT_PASS: "guest"

volumes:
  db_data: